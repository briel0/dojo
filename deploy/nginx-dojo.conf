# Dojo: só dentro da VM (acesso pelo túnel SSH, como o Planner)
server {
    listen 127.0.0.1:8082;
    root /opt/dojo/app/web;
    index index.html;

    # O JSON fica fora do repositório, onde o coletor grava
    location = /activity.json {
        alias /var/lib/dojo/activity.json;
        add_header Cache-Control "no-store";
    }

    # Card GRUB do "For you" (decisão 19): só as rotas públicas do problema do dia, só GET, sem cookies.
    # O resolver com variável faz o nginx reconsultar o DNS do GRUB (atrás da Cloudflare, o IP muda).
    location ~ "^/grub/api/v1/daily(/days/[0-9]{4}-[0-9]{2}-[0-9]{2}|/month)?$" {
        limit_except GET { deny all; }
        resolver 127.0.0.53 valid=300s;
        set $grub_api https://api.grubufabc.com;
        rewrite ^/grub(/.*)$ $1 break;
        proxy_pass $grub_api;
        proxy_ssl_server_name on;
        proxy_set_header Host api.grubufabc.com;
        proxy_set_header Cookie "";
        proxy_set_header User-Agent "dojo";
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        add_header Cache-Control "no-store";
    }

    # O navegador sempre confere se o arquivo mudou (a resposta é um 304 rápido quando não mudou). Sem isso,
    # depois de um deploy ele pode misturar o HTML/CSS novo com o JavaScript antigo.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
