# Dojo: só dentro da VM (acesso pelo túnel SSH, como o Planner)
server {
    listen 127.0.0.1:8082;
    root /opt/dojo/app/web;
    index index.html;

    # O JSON fica fora do repositório, onde o coletor grava
    location = /activity.json {
        alias /var/lib/dojo/activity.json;
        add_header Cache-Control "no-store";
    }

    # O navegador sempre confere se o arquivo mudou (a resposta é um 304 rápido quando não mudou). Sem isso,
    # depois de um deploy ele pode misturar o HTML/CSS novo com o JavaScript antigo.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
