<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Quatro células do quadrinho: código, treino, aula e um dia com as três (faixas diagonais) -->
  <rect width="32" height="32" fill="#101014"/>
  <rect x="3" y="3" width="12" height="12" fill="#FF3B4E"/>
  <rect x="17" y="3" width="12" height="12" fill="#FFB000"/>
  <rect x="3" y="17" width="12" height="12" fill="#3D7BFF"/>
  <clipPath id="c"><rect x="17" y="17" width="12" height="12"/></clipPath>
  <g clip-path="url(#c)">
    <rect x="17" y="17" width="12" height="12" fill="#3D7BFF"/>
    <polygon points="17,17 29,17 29,21 21,29 17,29" fill="#FFB000"/>
    <polygon points="17,17 25,17 17,25" fill="#FF3B4E"/>
  </g>
</svg>
